name: Android UI Automation

on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development, master]
  workflow_dispatch:
    inputs:
      mobile_ref:
        description: Mobile revision to exercise
        default: development
        type: string
      backend_ref:
        description: Backend revision to exercise
        default: development
        type: string
      scenarios:
        description: Optional Playwright grep (empty runs the complete matrix)
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: onze-emulator-v2-${{ steps.mobile.outputs.sha }}
    env:
      CI: true
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
      EXPO_PUBLIC_ENV: development
      EXPO_PUBLIC_EAS_PROJECT_ID: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: LuisLipinski/onze-mobile
          ref: ${{ inputs.mobile_ref || 'development' }}
          path: mobile-source
          persist-credentials: false
      - name: Identify mobile revision
        id: mobile
        run: echo "sha=$(git -C mobile-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore verified emulator APK
        uses: actions/cache@v4
        id: apk-cache
        with:
          path: .runtime/apk
          key: onze-emulator-apk-v2-${{ steps.mobile.outputs.sha }}
      - name: Find previous verified build for this source and recipe
        if: steps.apk-cache.outputs.cache-hit != 'true'
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EMULATOR_ARTIFACT_NAME: onze-emulator-v2-${{ steps.mobile.outputs.sha }}
        run: node scripts/find-emulator-apk.mjs
      - name: Download previous verified emulator build
        if: steps.previous.outputs.run_id
        uses: actions/download-artifact@v6
        with:
          name: onze-emulator-v2-${{ steps.mobile.outputs.sha }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .runtime/apk
      - name: Check existing APK source and checksum
        id: existing
        run: |
          if [ -f .runtime/apk/mobile-revision.txt ] && [ "$(cat .runtime/apk/mobile-revision.txt)" = "$(git -C mobile-source rev-parse HEAD)" ]; then
            sha256sum -c .runtime/apk/SHA256SUMS
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund
      - name: Inventory current Expo Router screens
        run: npm run frontend:contract
      - name: Install mobile dependencies
        if: steps.existing.outputs.ready != 'true'
        working-directory: mobile-source
        run: npm install --no-audit --no-fund
      - name: Build isolated x86_64 release APK
        if: steps.existing.outputs.ready != 'true'
        working-directory: mobile-source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('app.json')
          config = json.loads(path.read_text())
          # Isolate the remote push provider in this disposable emulator build.
          # Functional app code and local notification handling remain real.
          config['expo'].setdefault('extra', {}).pop('eas', None)
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')
          PY
          npx expo prebuild --platform android --clean
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', android[1:-1])
          ET.register_namespace('tools', 'http://schemas.android.com/tools')
          tree = ET.parse(manifest)
          app = tree.getroot().find('application')
          # Loopback API and isolated providers only in this emulator recipe.
          app.set(android + 'usesCleartextTraffic', 'true')
          for name in ['firebase_messaging_auto_init_enabled', 'firebase_analytics_collection_enabled']:
            node = next((n for n in app.findall('meta-data') if n.get(android + 'name') == name), None)
            if node is None:
              node = ET.SubElement(app, 'meta-data', {android + 'name': name})
            node.set(android + 'value', 'false')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=2
      - name: Verify APK and record exact source
        run: |
          mkdir -p .runtime/apk
          if [ '${{ steps.existing.outputs.ready }}' != 'true' ]; then
            cp mobile-source/android/app/build/outputs/apk/release/app-release.apk .runtime/apk/onze-automation-emulator.apk
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose .runtime/apk/onze-automation-emulator.apk
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('.runtime/apk/onze-automation-emulator.apk') as apk:
            config = json.loads(apk.read('assets/app.config'))
          config = config.get('expo', config)
          assert not config.get('extra', {}).get('eas', {}).get('projectId'), 'Emulator APK contains a remote EAS project'
          print('Verified emulator provider isolation: EAS project omitted')
          PY
          sha256sum .runtime/apk/onze-automation-emulator.apk > .runtime/apk/SHA256SUMS
          git -C mobile-source rev-parse HEAD > .runtime/apk/mobile-revision.txt
          echo '{"recipe":2,"remotePush":"EAS project omitted; FCM auto-init disabled","notificationPermission":"granted in emulator fixture"}' > .runtime/apk/emulator-recipe.json
      - uses: actions/upload-artifact@v6
        with:
          name: onze-emulator-v2-${{ steps.mobile.outputs.sha }}
          include-hidden-files: true
          path: .runtime/apk/
          retention-days: 7

  android:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: onze
          POSTGRES_PASSWORD: onze-automation-only
          POSTGRES_DB: onze_automation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onze -d onze_automation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONZE_API_DIR: ${{ github.workspace }}/backend-source
      ONZE_MOBILE_DIR: ${{ github.workspace }}/mobile-source
      AUTOMATION_CONTROL_TOKEN: isolated-ci-control-0123456789-automation
      AUTOMATION_DATABASE_PASSWORD: onze-automation-only
      FRONTEND_APK: ${{ github.workspace }}/.runtime/apk/onze-automation-emulator.apk
      AUTOMATION_MEDIA_BASE_URL: http://10.0.2.2:8090/media
      FRONTEND_SHARD: ${{ matrix.shard }}
      FRONTEND_FILTER: ${{ inputs.scenarios }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: LuisLipinski/onze-api
          ref: ${{ inputs.backend_ref || 'development' }}
          path: backend-source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: LuisLipinski/onze-mobile
          ref: ${{ inputs.mobile_ref || 'development' }}
          path: mobile-source
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-source/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx appium driver install uiautomator2@8.7.1
      - run: npm run typecheck
      - name: Record source and check contracts
        run: |
          npm run backend:contract
          npm run frontend:contract
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.apk.outputs.artifact_name }}
          path: .runtime/apk
      - name: Verify emulator APK matches checked-out mobile source
        run: |
          sha256sum -c .runtime/apk/SHA256SUMS
          test "$(cat .runtime/apk/mobile-revision.txt)" = "$(git -C mobile-source rev-parse HEAD)"
      - name: Create isolated tools database
        env:
          PGPASSWORD: onze-automation-only
        run: psql -h 127.0.0.1 -U onze -d onze_automation -c 'CREATE DATABASE onze_automation_tools'
      - name: Start isolated API and native automation server
        run: |
          npm run backend:start > .runtime/startup.log 2>&1 &
          npx appium --address 127.0.0.1 --port 4723 --log .runtime/appium.log > .runtime/appium-startup.log 2>&1 &
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # The profile's default userdata needs over 7 GB and can exceed
          # remaining runner space after the API, SDK and APK are installed.
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell wm density 360
            timeout 60 adb wait-for-device
            for attempt in $(seq 1 20); do adb shell cmd activity get-current-user >/dev/null 2>&1 && break; sleep 1; done
            npm run frontend:test -- --shard=${{ matrix.shard }}/8 --grep="${FRONTEND_FILTER:-.}"
      - name: Publish native evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-ui-report-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            frontend-report/
            frontend-results/
            coverage/results/frontend-*.json
            .runtime/*.log
            .runtime/*-source.json
            .runtime/apk/mobile-revision.txt
            .runtime/apk/SHA256SUMS
            .runtime/apk/emulator-recipe.json
          retention-days: 14

  coverage:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - uses: actions/download-artifact@v6
        with:
          pattern: android-ui-report-*
          path: .runtime/android-shards
      - name: Require all declared native flows and routes
        if: ${{ !inputs.scenarios }}
        run: node scripts/check-frontend-results.mjs
      - uses: actions/upload-artifact@v6
        if: ${{ !inputs.scenarios }}
        with:
          name: frontend-coverage
          path: coverage/results/frontend-coverage.*
          retention-days: 14
