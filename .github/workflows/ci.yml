name: Automation CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Commit or branch of onze-api to validate
        default: development
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: onze
          POSTGRES_PASSWORD: onze-automation-only
          POSTGRES_DB: onze_automation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onze -d onze_automation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_BASE_URL: http://127.0.0.1:8080
      ONZE_API_DIR: ${{ github.workspace }}/backend-source
      AUTOMATION_CONTROL_TOKEN: isolated-ci-control-0123456789-automation
      AUTOMATION_DATABASE_PASSWORD: onze-automation-only
      BACKEND_COVERAGE_GATE: 'true'
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout API source
        uses: actions/checkout@v7
        with:
          repository: LuisLipinski/onze-api
          ref: ${{ inputs.backend_ref || 'development' }}
          path: backend-source
          persist-credentials: false
      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-source/pom.xml
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Check backend operation inventory
        run: npm run backend:contract
      - name: Create isolated tools database
        env:
          PGPASSWORD: onze-automation-only
        run: psql -h 127.0.0.1 -U onze -d onze_automation -c 'CREATE DATABASE onze_automation_tools'
      - name: Start real API with isolated provider boundaries
        run: npm run backend:start > .runtime/startup.log 2>&1 &
      - name: Backend scenarios and coverage gate
        run: npm test
      - name: Publish test reports and exact backend revision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-automation-report
          path: |
            playwright-report/
            test-results/
            coverage/results/
            .runtime/*.log
            .runtime/backend-source.json
          retention-days: 14
